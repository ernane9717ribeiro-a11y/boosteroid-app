name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Corrigir AndroidManifest.xml (remover v1 embedding)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:name="io.flutter.app.FlutterApplication"//g' $MANIFEST
          sed -i 's/io.flutter.app.FlutterActivity/io.flutter.embedding.android.FlutterActivity/g' $MANIFEST
          if ! grep -q 'flutterEmbedding' $MANIFEST; then
            sed -i 's|</application>|    <meta-data android:name="flutterEmbedding" android:value="2"/>\n    </application>|' $MANIFEST
          fi
          cat $MANIFEST

      - name: Criar MainActivity.kt
        run: |
          MAIN_DIR="android/app/src/main/kotlin/com/example/boosteroid_app"
          mkdir -p $MAIN_DIR
          cat > "$MAIN_DIR/MainActivity.kt" << 'EOF'
          package com.example.boosteroid_app

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity()
          EOF

      - name: Baixar dependências
        run: flutter pub get

      - name: Aceitar licenças Android
        run: yes | flutter doctor --android-licenses || true

      - name: Compilar APK Release
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: boosteroid-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
          
