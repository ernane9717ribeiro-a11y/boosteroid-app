name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Reescrever AndroidManifest.xml completo
        run: |
          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <application
                  android:label="Boosteroid"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme"/>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2"/>
              </application>
          </manifest>
          EOF

      - name: Reescrever MainActivity.kt
        run: |
          # Descobre o package do pubspec
          PKG=$(grep -E "^name:" pubspec.yaml | awk '{print $2}' | tr '-' '_')
          DIR="android/app/src/main/kotlin/com/example/${PKG}"
          mkdir -p "$DIR"
          cat > "$DIR/MainActivity.kt" << EOF
          package com.example.${PKG}

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity()
          EOF
          echo "MainActivity criado em $DIR"

      - name: Corrigir build.gradle - namespace e compileSdk
        run: |
          GRADLE="android/app/build.gradle"
          # Garante namespace
          if ! grep -q "namespace" $GRADLE; then
            sed -i '/^android {/a\    namespace "com.example.boosteroid_app"' $GRADLE
          fi
          cat $GRADLE

      - name: Baixar dependências
        run: flutter pub get

      - name: Aceitar licenças Android
        run: yes | flutter doctor --android-licenses || true

      - name: Compilar APK Release
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: boosteroid-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7